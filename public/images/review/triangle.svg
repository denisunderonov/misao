<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">Прямоугольный треугольник 3–4–5</title><desc id="desc">A слева внизу, C справа внизу с прямым углом, B справа вверху. AC=3, CB=4, AB=5, альфа при A. Масштаб сторон одинаков.</desc><rect width="600" height="440" rx="20" fill="#f5f7ff"/><g stroke="#34447a" stroke-width="4" fill="none"><path d="M110 370H350V50Z"/><path d="M330 370v-20h20"/><path d="M170 370a60 60 0 0 0-24-48"/></g><g fill="#172344" font-family="sans-serif" font-size="24"><text x="80" y="401">A</text><text x="360" y="401">C</text><text x="360" y="50">B</text><text x="220" y="403">3</text><text x="370" y="220">4</text><text x="200" y="180">5</text><text x="175" y="345">α</text></g></svg>